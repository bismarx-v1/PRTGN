; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:custom_esp32s3_n4]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Force PlatformIO to use 4MB Flash limitations
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio

; Explicitly disable PSRAM by picking a non-PSRAM memory type
board_build.arduino.memory_type = qio_qspi

; Select a safe 4MB partition table layout (No OTA leaves ~3MB for app)
board_build.partitions = default.csv

; Build flags for native USB CDC (essential for most custom S3 troubleshooting)
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1